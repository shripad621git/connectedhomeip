#
#    Board-specific Kconfig for the ESP32-C6 DevKit. Applied automatically for
#    board target esp32c6_devkitc/esp32c6/hpcore.
#

# ---- BLE ----------------------------------------------------------------------
# BLE is disabled in this build (CONFIG_BT=n in prj.conf), so no BT controller
# buffers / CHIPoBLE BTP MTU settings are needed here. With only WiFi active the
# radio coexistence arbiter (libcoexist) is unused and the ~50 KB esp BT heap is
# reclaimed. Re-add CONFIG_BT_BUF_ACL_*=251 / CONFIG_BT_L2CAP_TX_MTU=247 here if
# BLE is ever turned back on for CHIPoBLE commissioning.

# ESP32 WiFi (BLE off, so no coex needed).
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

# WiFi buffer counts drive the largest single RAM block (the ~94 KB esp32 WiFi
# heap). The driver defaults (RX 10 static / 32 dynamic, TX 32 dynamic) target
# throughput devices; a single-endpoint Matter light needs far fewer. Trim them
# down — this is the biggest RAM lever on the C6.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_RX_BA_WIN=4
CONFIG_ESP32_WIFI_TX_BA_WIN=4

# NOTE on the largest RAM block (~94 KB): it is the Zephyr system heap, built from
# HEAP_MEM_POOL_ADD_SIZE_ESP_BT (50 KB) + _ESP_WIFI (40 KB). Those are NOT
# user-configurable — hal_espressif hard-codes them as the minimum the C6 BT/WiFi
# blobs require (no Kconfig prompt; the reduced value needs PSRAM the DevKit lacks).
# So this ~94 KB radio-blob heap is a fixed floor on the C6 and cannot be trimmed
# from the app without editing the Zephyr driver Kconfig (and risking radio stability).

# ---- Stacks (C6 has NO PMP stack guard — size deliberately) -------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ---- Network buffers: trimmed from the shared defaults (80/80) to fit C6 SRAM --
# The generic defaults target roomier parts. 24/24 RX/TX is enough for a single
# light's commissioning + a couple of subscriptions; raise if you see net-buf
# allocation failures (which preceded crashes during standalone bring-up).
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
