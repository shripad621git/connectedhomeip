# Common defaults come from config/zephyr/chip-module/Kconfig.defaults (pulled in
# via this example's Kconfig). This file holds ONLY C6-specific choices and
# overrides. RAM (~497 KiB SRAM) is the binding budget on this chip — every knob
# below was chosen with that in mind.

# ---- Matter core --------------------------------------------------------------
CONFIG_CHIP=y
CONFIG_STD_CPP17=y
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_CHIP_DEVICE_VENDOR_ID=65521

# Open the basic commissioning window automatically at boot. REQUIRED here: the
# Zephyr platform forces CHIP_DEVICE_CONFIG_ENABLE_PAIRING_AUTOSTART=0 when this
# Kconfig is unset (CHIPDevicePlatformConfig.h) — overriding CHIP's generic
# default of 1 — so Server::Init's OpenBasicCommissioningWindow() branch
# (advertiseCommissionableIfNoFabrics) never runs and the window stays CLOSED.
# The device would then advertise _matterc._udp with cm=0 (discoverable via
# extended discovery, but NOT pairable). With BLE gone there is no button/app
# path to open it either, so autostart is how a fresh device becomes commissionable.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Transport = WiFi (see Kconfig). Force OpenThread OFF: the shared defaults enable
# it by default, and we do not want the 802.15.4 L2 + OpenThread RAM on a WiFi build.
CONFIG_CHIP_WIFI=y
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_OPENTHREAD=n

# BLE is DISABLED in this build (CONFIG_BT=n). This is the single master switch:
#   - GN chip_config_network_layer_ble <- CONFIG_BT  => CHIP's BLE net layer is
#     compiled out (chip_gn_kconfig_defaults.cmake).
#   - CHIP_DEVICE_CONFIG_ENABLE_CHIPOBLE <- CONFIG_BT => BLEManagerImpl compiled out
#     (src/platform/Zephyr/CHIPDevicePlatformConfig.h).
#   - Frees the ~50 KB HEAP_MEM_POOL_ADD_SIZE_ESP_BT radio-blob heap.
# CONSEQUENCE: no CHIPoBLE. A fresh device can no longer be BLE-commissioned;
# only on-network commissioning is possible (device must already be on WiFi).
CONFIG_BT=n

# ---- Networking ---------------------------------------------------------------
# Matter operational traffic is IPv6; WiFi/DHCP need IPv4 too.
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y

# ESP32-native WiFi: STA-only. Keep the WiFi Network Manager OFF — the esp32
# driver only registers with the NM in AP+STA mode, so WIFI_NM=y makes STA-mode
# management calls fail ("Interface -1 is not a nm wifi iface").
CONFIG_WIFI_NM=n

# ---- C library ----------------------------------------------------------------
# Use newlib, not picolibc. CHIP pulls in C++ <chrono>/<ctime>, and picolibc's
# <time.h> declares clock_getcpuclockid(pid_t, clockid_t*) in a way that fails to
# compile against CHIP's include setup (pid_t/clockid_t not visible). newlib is
# the C library CHIP's Zephyr crypto/system layers are validated against.
CONFIG_NEWLIB_LIBC=y

# ---- Link-stage feature enablement (functions CHIP references) ----------------
# Enable the classic mbedTLS AES block cipher. This is the KEYSTONE symbol for
# CHIP's classic crypto PAL and MUST be set explicitly now that BLE is disabled:
# with CONFIG_BT on, the Bluetooth stack pulled AES in; without it, AES defaults
# off (its default is `y if PSA_WANT_KEY_TYPE_AES && MBEDTLS_PSA_CRYPTO_C`, and we
# don't set PSA_WANT_KEY_TYPE_AES). AES gates two things CHIP links against:
#   - MBEDTLS_SOME_AEAD_CIPHER_ENABLED -> unlocks CIPHER_CCM_ENABLED (AES-CCM)
#   - MBEDTLS_CTR_DRBG_C (depends on MBEDTLS_CIPHER_AES_ENABLED) -> the RNG
# Without this, the link fails with undefined mbedtls_ccm_* / mbedtls_ctr_drbg_*.
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
# CHIP's crypto uses classic AES-CCM (mbedtls_ccm_init/setkey/encrypt_and_tag/...).
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
# WiFiManager sends IPv6 router solicitations (net_if_start_rs), gated by ND.
# ND depends on the neighbor cache, which our Kconfig.defaults turns off to save
# RAM — re-enable it here so ND (and net_if_start_rs) actually build.
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_ND=y

# ---- Persistence --------------------------------------------------------------
# KVS + device config go through the Zephyr settings subsystem over NVS.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ---- RAM / footprint tuning (C6-specific) -------------------------------------
# Shell enabled to bring WiFi up out-of-band. With BLE disabled there is no
# Matter path to deliver WiFi credentials, so the console provides the `wifi`
# command to connect manually:  wifi connect "<SSID>" -p "<PSK>" -k 1
# (-k 1 = WPA2-PSK). NET_L2_WIFI_SHELL auto-selects NET_L2_WIFI_MGMT/UTILS +
# SHELL_GETOPT/GETOPT_LONG. NET_SHELL adds `net iface`/`net dhcpv4` to confirm
# the device got an IP before Matter on-network commissioning. Affordable now:
# dropping BLE freed ~130 KB SRAM. We DON'T enable the Matter (CHIP) shell — only
# the Zephyr wifi/net shell is needed to get on the network.
CONFIG_CHIP_LIB_SHELL=n
CONFIG_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_OPENTHREAD_SHELL=n

# No OTA: the C6 bring-up uses ESP_SIMPLE_BOOT (no MCUboot slots), and OTA pulls
# in the image manager + a second flash slot we do not have partitioned.
CONFIG_CHIP_OTA_REQUESTOR=n

# No factory data: this example uses the built-in example DAC + test passcode.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n

# Bound the CHIP allocator to a fixed sys-heap. Sized against the vendors:
# nrfconnect uses 14 KB on WiFi, NXP 28 KB. 16 KB is a safe middle for a single
# On/Off light; raise if you see CHIP allocation failures at commissioning.
CONFIG_CHIP_MALLOC_SYS_HEAP=y
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=16384

# mbedTLS heap (crypto/PASE). 15 KB is the shared default; keep it explicit.
CONFIG_MBEDTLS_HEAP_SIZE=15360

# ---- mbedTLS features CHIP's crypto PAL requires -------------------------------
# Zephyr's default mbedTLS config only enables what Zephyr's own components use.
# CHIP's classic mbedTLS crypto backend needs these primitives explicitly:
#   - PKCS5/PBKDF2 (mbedtls_pkcs5_pbkdf2_hmac)  - PASE setup
#   - full ECP (mbedtls_ecp_muladd) + secp256r1 - portable SPAKE2+ point math
#   - ECDH/ECDSA, HKDF, DRBG, entropy           - CASE, key derivation, RNG
#   - PK write + X.509 CSR                       - operational cert / CSR
CONFIG_MBEDTLS_PKCS5_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_HKDF_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y
CONFIG_MBEDTLS_HMAC_DRBG_C=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
# PK write + X.509 CSR pull in mbedTLS 3.6's pkwrite.c, which needs the PSA
# error-bridge (psa_to_pk_ecdsa_errors) — enable USE_PSA_CRYPTO for consistency.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_USE_PSA_CRYPTO=y
# With USE_PSA_CRYPTO on, mbedTLS's PK/pkwrite layer needs the PSA ECC error
# bridge (psa_to_pk_ecdsa_errors), which is only defined when the PSA ECC
# key-type/alg WANT symbols are set. Enable them for internal coherence.
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# ---- WiFi network statistics (generic ZephyrWifiDriver diagnostics need these) -
# WiFiManager / DiagnosticDataProviderImplWiFi issue NET_REQUEST_STATS_GET_WIFI /
# NET_REQUEST_STATS_RESET_WIFI, which are only declared with these enabled.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y

# The C6 has NO PMP hardware stack guard in this Zephyr (v4.4.1): a stack
# overflow corrupts silently. Enable software stack-canary + thread analyzer so
# overruns are caught while you tune stacks with `ram_report`.
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_CANARIES=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# ---- Diagnostics / logging ----------------------------------------------------
CONFIG_LOG=y
# Use IMMEDIATE (synchronous) logging, NOT the stock deferred mode. Deferred
# packages records into a 1 KB ring buffer drained by a low-prio thread trickling
# bytes out the 115200 UART; the boot burst (LogDeviceConfig + PrintOnboardingCodes
# emit ~20 lines in one 10 ms window) overflows it and the log core drops the
# oldest records ("--- N messages dropped ---"). Immediate mode writes each record
# inline so nothing is lost — the right trade-off for bring-up (cost: slower boot,
# UART blocks the logging thread). Switch back to deferred + larger LOG_BUFFER_SIZE
# once bring-up is stable and boot-time throughput matters.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CHIP_APP_LOG_LEVEL=3
CONFIG_THREAD_NAME=y
CONFIG_USE_SEGGER_RTT=n
