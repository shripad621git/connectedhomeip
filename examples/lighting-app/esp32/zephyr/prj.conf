# Common defaults come from config/zephyr/chip-module/Kconfig.defaults (pulled in
# via this example's Kconfig). This file holds ONLY C6-specific choices and
# overrides. RAM (~497 KiB SRAM) is the binding budget on this chip — every knob
# below was chosen with that in mind.

# ---- Matter core --------------------------------------------------------------
CONFIG_CHIP=y
CONFIG_STD_CPP17=y
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_CHIP_DEVICE_VENDOR_ID=65521

# Open the basic commissioning window automatically at boot. REQUIRED here: the
# Zephyr platform forces CHIP_DEVICE_CONFIG_ENABLE_PAIRING_AUTOSTART=0 when this
# Kconfig is unset (CHIPDevicePlatformConfig.h) — overriding CHIP's generic
# default of 1 — so Server::Init's OpenBasicCommissioningWindow() branch
# (advertiseCommissionableIfNoFabrics) never runs and the window stays CLOSED.
# The device would then advertise _matterc._udp with cm=0 (discoverable via
# extended discovery, but NOT pairable). With BLE gone there is no button/app
# path to open it either, so autostart is how a fresh device becomes commissionable.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Transport = WiFi (see Kconfig). Force OpenThread OFF: the shared defaults enable
# it by default, and we do not want the 802.15.4 L2 + OpenThread RAM on a WiFi build.
CONFIG_CHIP_WIFI=y
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_OPENTHREAD=n

# BLE ENABLED (CONFIG_BT=y) — CHIPoBLE commissioning. CONFIG_BT is the single
# master switch: it drives GN chip_config_network_layer_ble and
# CHIP_DEVICE_CONFIG_ENABLE_CHIPOBLE, so BLEManagerImpl + the BLE net layer are
# compiled in. Costs ~92 KB SRAM (BT host/controller + coex + GATT + the ESP BT
# heap). With BLE on, a fresh device is commissioned over BLE:
#   chip-tool pairing ble-wifi 1 <SSID> <PSK> 20202021 3840
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MatterLightC6"
# CHIPoBLE registers its GATT service dynamically at runtime.
CONFIG_BT_GATT_DYNAMIC_DB=y
# Connection policy taken from config/zephyr/chip-module/Kconfig.bt. That file
# exists but master never sources it (PR #73899 wires it in under `if CHIP`), so
# every value in it is currently dead. 36/36 = a 45 ms connection interval, which
# is what nrfconnect/Telink/NXP Matter builds run; leaving Zephyr's own defaults
# gives CHIPoBLE different BTP timing from every reference platform.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=36
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=36
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=15
# The BT host needs its own crypto for LE SC / session setup under PSA.
CONFIG_BT_HOST_CRYPTO=y

# ---- Networking ---------------------------------------------------------------
# Matter operational traffic is IPv6; WiFi/DHCP need IPv4 too.
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y

# ESP32-native WiFi: STA-only. Keep the WiFi Network Manager OFF — the esp32
# driver only registers with the NM in AP+STA mode, so WIFI_NM=y makes STA-mode
# management calls fail ("Interface -1 is not a nm wifi iface").
CONFIG_WIFI_NM=n

# ---- C library ----------------------------------------------------------------
# picolibc. On Zephyr 4.3.x this example used newlib, because picolibc's <time.h>
# declared clock_getcpuclockid(pid_t, clockid_t*) in a way that broke CHIP's
# include setup. On 4.4.x newlib is no longer selectable here - Kconfig reports
# "NEWLIB_LIBC was selected but PICOLIBC ended up as the choice selection" - and
# the S31 Matter port runs picolibc on 4.4.x successfully. THREAD_LOCAL_STORAGE
# is required with picolibc: CHIP uses thread_local and picolibc has no
# __tls_get_addr fallback.
CONFIG_PICOLIBC=y
CONFIG_THREAD_LOCAL_STORAGE=y

# ---- Link-stage feature enablement (functions CHIP references) ----------------
# AES/CCM are no longer requested here. Under the PSA crypto backend (see the
# crypto section below) CHIP calls psa_aead_* instead of mbedtls_ccm_*, and the
# PSA_WANT_* symbols pull in whichever primitives the PSA driver needs.
# WiFiManager sends IPv6 router solicitations (net_if_start_rs), gated by ND.
# ND depends on the neighbor cache, which our Kconfig.defaults turns off to save
# RAM — re-enable it here so ND (and net_if_start_rs) actually build.
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_ND=y

# ---- Persistence --------------------------------------------------------------
# KVS + device config go through the Zephyr settings subsystem over NVS.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ---- RAM / footprint tuning (C6-specific) -------------------------------------
# Shell DISABLED. With BLE enabled, CHIPoBLE commissioning delivers the WiFi
# credentials over the Network Commissioning cluster, so the out-of-band `wifi`
# shell is redundant. Dropping it reclaims ~10 KB SRAM — worth it here since the
# BLE build is tight (~91%) and the commissioning peak (BLE PASE + WiFi bring-up
# + coex) needs the headroom. Re-enable CONFIG_SHELL=y + CONFIG_NET_L2_WIFI_SHELL=y
# + CONFIG_NET_SHELL=y only for a WiFi-only (BLE-off) build or manual debugging.
CONFIG_CHIP_LIB_SHELL=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n

# No OTA: the C6 bring-up uses ESP_SIMPLE_BOOT (no MCUboot slots), and OTA pulls
# in the image manager + a second flash slot we do not have partitioned.
CONFIG_CHIP_OTA_REQUESTOR=n

# No factory data: this example uses the built-in example DAC + test passcode.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n

# Bound the CHIP allocator to a fixed sys-heap. Sized against the vendors:
# nrfconnect uses 14 KB on WiFi, NXP 28 KB. 16 KB is a safe middle for a single
# On/Off light; raise if you see CHIP allocation failures at commissioning.
CONFIG_CHIP_MALLOC_SYS_HEAP=y
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=16384

# mbedTLS heap (crypto/PASE). 15 KB is the shared default; keep it explicit.
CONFIG_MBEDTLS_HEAP_SIZE=15360

# ---- Crypto: PSA backend (REQUIRED on Zephyr 4.4.x / mbedTLS 4.x) -------------
# Zephyr 4.4.x ships mbedTLS 4.x (TF-PSA-Crypto), which moved the classic API
# (mbedtls/bignum.h, mbedtls/ecp.h, mbedtls_pkcs5_pbkdf2_hmac) under
# mbedtls/private/. CHIPCryptoPALmbedTLS.cpp includes them unguarded and will not
# compile; CHIPCryptoPALPSA.cpp is version-gated and does. So select the PSA
# backend rather than pinning Zephyr back to 4.3.x.
CONFIG_CHIP_CRYPTO_PSA=y
# Keep SPAKE2+ on mbedTLS. With chip_crypto_spake2p="psa", src/crypto/BUILD.gn
# compiles PSASpake2p.cpp, which needs PSA_ALG_SPAKE2P_MATTER - not implemented in
# mainline TF-PSA-Crypto. With "mbedtls" the SPAKE2+ implementation inside
# CHIPCryptoPALPSA.cpp (#if CHIP_CRYPTO_SPAKE2P_MBEDTLS) is used instead.
CONFIG_CHIP_CRYPTO_SPAKE2P_MBEDTLS=y

# Entropy. PlatformManagerImpl.cpp only skips installing its own mbedTLS entropy
# source when one of the known providers is configured; MBEDTLS_PSA_DRIVER_GET_ENTROPY
# is the one that applies here (same choice upstream's Zephyr all-devices-app makes).
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_PSA_DRIVER_GET_ENTROPY=y

# PSA primitives CHIP's PSA PAL and the mbedTLS SPAKE2+ path require.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y

# X.509 / PK still come from the mbedTLS side for DAC parsing and CSR generation.
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y

# One slot per CASE session plus transient operations during commissioning.
# One slot per active CASE session plus transients. 64 was carried over from a
# PSRAM-equipped board; on the C6 the slot table is static internal RAM, and a
# 5-fabric light never approaches that many live keys.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=16

# ---- WiFi network statistics (generic ZephyrWifiDriver diagnostics need these) -
# WiFiManager / DiagnosticDataProviderImplWiFi issue NET_REQUEST_STATS_GET_WIFI /
# NET_REQUEST_STATS_RESET_WIFI, which are only declared with these enabled.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y

# The C6 has NO PMP hardware stack guard in this Zephyr (v4.3.1): a stack
# overflow corrupts silently. Enable software stack-canary + thread analyzer so
# overruns are caught while you tune stacks.
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_CANARIES=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# Stack right-sizing measurement. AUTO spawns a low-prio thread that prints each
# thread's stack high-water-mark every INTERVAL seconds; INIT_STACKS paints stacks
# at boot so the "unused" figure is an accurate peak, not a snapshot. Boot, let it
# commission, then read the "unused N B" per thread and trim stacks to peak+margin.
# Turn AUTO/INIT_STACKS off once stacks are sized (they cost a little RAM/CPU).
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_INIT_STACKS=y

# ---- Diagnostics / logging ----------------------------------------------------
CONFIG_LOG=y
# Use IMMEDIATE (synchronous) logging, NOT the stock deferred mode. Deferred
# packages records into a 1 KB ring buffer drained by a low-prio thread trickling
# bytes out the 115200 UART; the boot burst (LogDeviceConfig + PrintOnboardingCodes
# emit ~20 lines in one 10 ms window) overflows it and the log core drops the
# oldest records ("--- N messages dropped ---"). Immediate mode writes each record
# inline so nothing is lost — the right trade-off for bring-up (cost: slower boot,
# UART blocks the logging thread). Switch back to deferred + larger LOG_BUFFER_SIZE
# once bring-up is stable and boot-time throughput matters.
CONFIG_LOG_MODE_IMMEDIATE=y
# Bring-up debugging: CHIP at DEBUG (4) so ChipLogDetail from BLEManagerImpl, the
# BTP engine, and PASESession are emitted — needed to see the device side of the
# CHIPoBLE GATT-write failure. Immediate mode above guarantees these survive even a
# hard fault. Drop back to 3 (INFO) once commissioning is stable.
CONFIG_CHIP_APP_LOG_LEVEL=4
CONFIG_THREAD_NAME=y
CONFIG_USE_SEGGER_RTT=n
