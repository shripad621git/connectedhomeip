CONFIG_BT_DEVICE_NAME="MatterLightH2"

# The ESP32-H2 has no Wi-Fi radio: Matter over Thread only.
# CHIP_WIFI selects WIFI and WIFI_ESP32, so this turns the Wi-Fi stack off entirely
CONFIG_CHIP_WIFI=n
CONFIG_NET_STATISTICS_WIFI=n
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_IPV6_ND=n
CONFIG_NET_IPV6_NBR_CACHE=n

CONFIG_OPENTHREAD=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6144
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_MLR=y
CONFIG_OPENTHREAD_DUA=y
CONFIG_OPENTHREAD_LINK_METRICS_INITIATOR=y
CONFIG_OPENTHREAD_LINK_METRICS_SUBJECT=y

# Bluetooth Low Energy buffers: CHIPoBLE needs an ATT MTU of at least 247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_RX_STACK_SIZE=4096

# BLE controller: one peripheral connection plus advertising is enough
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=2

# Stack size settings
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

# Buffers and heaps sized for the 320 KB SRAM of the ESP32-H2
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=10240
CONFIG_OPENTHREAD_MAX_CHILDREN=10
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=64
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_TX_COUNT=6
CONFIG_MBEDTLS_HEAP_SIZE=12288

# BLE controller pools for a single CHIPoBLE connection. The controller
# allocates them from the kernel heap, whose driver default of 50000 bytes
# does not fit next to OpenThread.
CONFIG_ESP32_BT_LE_MAX_CONNECTIONS=1
CONFIG_ESP32_BT_LE_ACL_BUF_COUNT=5
CONFIG_ESP32_BT_LE_MSYS_2_BLOCK_COUNT=12
CONFIG_ESP32_BT_LE_HCI_EVT_HI_BUF_COUNT=15
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=28672
