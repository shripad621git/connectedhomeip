# Matter Speaker for the ESP32-S31: Matter over Wi-Fi, commissioning over BLE,
# audio over Bluetooth Classic (A2DP sink).

# --- Matter -----------------------------------------------------------------
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"
# The application builds its data model at run time (see main/AppTask.cpp)
CONFIG_CHIP_DATA_MODEL_CODEDRIVEN=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_PERSISTENT_SUBSCRIPTIONS=y
CONFIG_CHIP_TASK_STACK_SIZE=10240
CONFIG_MAX_EVENT_QUEUE_SIZE=16
CONFIG_STD_CPP17=y

# --- Wi-Fi and IP -----------------------------------------------------------
# ESP32-native Wi-Fi driver, no WPA supplicant
CONFIG_WIFI=y
CONFIG_CHIP_WIFI=y
CONFIG_CHIP_ENABLE_WIFI_STATION=y
# The esp32 driver only registers with the Wi-Fi network manager in AP+STA mode
CONFIG_WIFI_NM=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14
# Statistics used by the Matter diagnostics clusters
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_WIFI=y
# The board enables the Ethernet MAC by default; Matter uses the Wi-Fi interface only
CONFIG_ETH_DRIVER=n

# Wi-Fi driver buffers, reduced for the internal SRAM
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=12
CONFIG_ESP32_WIFI_RX_BA_WIN=4
CONFIG_ESP32_WIFI_TX_BA_WIN=4

# --- Bluetooth --------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HOST_CRYPTO=y
CONFIG_BT_RX_STACK_SIZE=4096
# BLE controller: one peripheral connection plus advertising is enough
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=2

# Bluetooth Classic A2DP sink
CONFIG_BT_CLASSIC=y
CONFIG_BT_AVDTP=y
CONFIG_BT_A2DP=y
CONFIG_BT_A2DP_SINK=y
# Name and class of device (audio, loudspeaker) shown to phones
CONFIG_BT_DEVICE_NAME="Matter Speaker"
CONFIG_BT_COD=0x200414
# One BR/EDR link next to the BLE commissioning link
CONFIG_BT_MAX_CONN=2
# BT_CLASSIC makes the stack bondable. Matter then advertises on a second identity
# with a random static address and leaves the first one to BR/EDR.
CONFIG_BT_ID_MAX=2
# A2DP media packets are larger than the BLE ACL buffers
CONFIG_BT_BUF_ACL_RX_SIZE=800
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=4

# --- Audio output -----------------------------------------------------------
# SBC decoder output goes to I2S and the ES8311 codec of the board
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
# Decoded audio queued for output, in SBC frames (2.9 ms each at 44.1 kHz). A2DP
# delivers about 7 frames every 20 ms, with jitter.
CONFIG_I2S_ESP32_TX_BLOCK_COUNT=40
# Keep the output running across a short gap between media packets
CONFIG_I2S_ESP32_ALLOWED_EMPTY_TX_QUEUE_DEFERRAL_TIME_MS=40

# --- Memory -----------------------------------------------------------------
# Wi-Fi, BLE, Bluetooth Classic and Matter do not fit together in the 504 KB of
# internal SRAM. The network stack memory, the Wi-Fi driver heap and the Matter BSS
# are in PSRAM. The application BSS stays in internal RAM: the SBC decoder runs on
# the Bluetooth RX thread, and with its state in PSRAM that thread is too slow and
# the controller drops media packets.
CONFIG_SOC_FAMILY_ESPRESSIF_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_SOC_FAMILY_ESPRESSIF_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libCHIP.a"

# The network buffers and the network RX stack are in PSRAM
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=80
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_RX_STACK_SIZE=4096

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_LOCAL_STORAGE=y
# No POSIX API subset; Matter uses the Zephyr APIs
CONFIG_POSIX_AEP_CHOICE_NONE=y

# --- Crypto -----------------------------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_CHIP_CRYPTO_PSA=y
# The Matter PSA crypto layer uses mbedtls_md_info_from_type() for SPAKE2+
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_PSA_DRIVER_GET_ENTROPY=y
# Matter needs more PSA key slots than the default
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=64
# Key pairs are imported from storage and exported for it
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
# BT_CLASSIC enables BT_SMP, which switches P-256 to the p256-m driver. That driver
# removes the Mbed TLS ECP code that Matter's SPAKE2+ needs.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# --- Storage ----------------------------------------------------------------
CONFIG_NVS_LOOKUP_CACHE=y

# --- Debugging --------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_CANARIES=y
CONFIG_INIT_STACKS=y
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n

CONFIG_BUILD_OUTPUT_HEX=y
