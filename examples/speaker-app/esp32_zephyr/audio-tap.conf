# Sends the decoded speaker audio to a host over UDP, so that the received audio
# can be checked on the host:
#   west build ... -- -DEXTRA_CONF_FILE=audio-tap.conf
# Receive it on the host with capture_song.py.

CONFIG_SPEAKER_AUDIO_UDP_TAP=y
# IPv4 address of the host that runs capture_song.py. Change it to your host.
CONFIG_SPEAKER_AUDIO_UDP_TAP_HOST="192.168.1.100"
CONFIG_SPEAKER_AUDIO_UDP_TAP_PORT=5005

# Stack size of the Bluetooth RX thread, which decodes the audio
CONFIG_BT_RX_STACK_SIZE=6144
# Wi-Fi shares the radio with Bluetooth and has no free TX buffer for up to some
# 100 ms. The tap thread waits this long for a buffer before the Wi-Fi driver
# drops the datagram. Other threads that send wait the same time.
CONFIG_ESP32_WIFI_TX_RETRY_TIMEOUT_MS=500
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=64
# Printing a log line on the Bluetooth RX thread blocks it for the UART time
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
# Shorter I2S queue: leaves more internal RAM for the Matter heap
CONFIG_I2S_ESP32_TX_BLOCK_COUNT=16
