# Sends the decoded speaker audio to a host over UDP, so that the received audio
# can be checked on the host. Add it after overlay-speaker-a2dp.conf:
#   -DEXTRA_CONF_FILE="overlay-speaker-a2dp.conf;speaker-a2dp/audio-tap.conf"
# Receive it on the host with speaker-a2dp/capture_song.py.

CONFIG_ALL_DEVICES_SPEAKER_AUDIO_UDP_TAP=y
# IPv4 address of the host that runs capture_song.py. Change it to your host.
CONFIG_ALL_DEVICES_SPEAKER_AUDIO_UDP_TAP_HOST="192.168.1.100"
CONFIG_ALL_DEVICES_SPEAKER_AUDIO_UDP_TAP_PORT=5005

# The Bluetooth RX thread also runs the UDP send path
CONFIG_BT_RX_STACK_SIZE=6144
# A tap datagram is dropped when Wi-Fi has no free TX buffer. Waiting for one
# blocks the Bluetooth RX thread, and the controller then drops media packets.
CONFIG_ESP32_WIFI_TX_RETRY_TIMEOUT_MS=0
# Media packets arrive in bursts, so the tap datagrams do too
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=64
# Printing a log line on the Bluetooth RX thread blocks it for the UART time
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
# Shorter I2S queue: leaves more internal RAM for the Matter heap
CONFIG_I2S_ESP32_TX_BLOCK_COUNT=16
